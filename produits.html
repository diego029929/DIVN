<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #222;
      color: #fff;
      padding: 10px 20px;
    }

    .menu-burger, .profile-icon {
      font-size: 1.5em;
      cursor: pointer;
    }

    .search-bar {
      flex: 1;
      margin: 0 15px;
      display: flex;
    }

    .search-bar input {
      flex: 1;
      padding: 5px;
      border: none;
      border-radius: 3px 0 0 3px;
    }

    .search-bar button {
      padding: 5px 10px;
      border: none;
      background: #444;
      color: #fff;
      cursor: pointer;
      border-radius: 0 3px 3px 0;
    }

    /* FILTER */
    .filter {
      padding: 15px;
      background: #f4f4f4;
      text-align: right;
    }

    .filter select {
      padding: 5px;
    }

    /* BACK BUTTON */
    .back-home {
      padding: 15px;
      background: #fafafa;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      background: #222;
      color: #fff;
      padding: 8px 15px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: #444;
    }

    /* PRODUCTS */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.2s;
      display: block;
    }

    .product-card:hover {
      transform: scale(1.02);
    }

    .product-slider img {
      width: 100%;
      display: block;
    }

    .product-title {
      font-weight: bold;
      margin: 10px 0;
    }

    .product-price {
      color: #555;
      margin-bottom: 15px;
    }

    /* MENU LATERAL */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 900;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 250px;
      height: 100%;
      background: #222;
      color: #fff;
      overflow-y: auto;
      padding: 20px;
      transition: left 0.3s;
      z-index: 1000;
    }

    .side-menu.active {
      left: 0;
    }

    .side-menu-header {
      text-align: right;
      font-size: 1.5em;
      cursor: pointer;
    }

    .side-menu ul {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }

    .side-menu ul li {
      margin-bottom: 15px;
    }

    .side-menu ul li a {
      text-decoration: none;
      color: #fff;
      font-size: 1em;
    }

    .social-links a {
      margin-right: 10px;
      color: #fff;
      font-size: 1.2em;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="menu-burger"><i class="fas fa-bars"></i></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher un produit...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <div class="profile-icon"><i class="fas fa-user"></i></div>
  </header>

  <!-- TRI -->
  <div class="filter">
    <select id="sort">
      <option value="pertinence">Pertinence</option>
      <option value="asc">Prix croissant</option>
      <option value="desc">Prix décroissant</option>
    </select>
  </div>

  <!-- RETOUR ACCUEIL -->
  <div class="back-home">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Retour à l'accueil
    </a>
  </div>

  <!-- PRODUITS -->
  <div class="products">
    <!-- Produits inchangés -->
    <div class="product-card" data-title="Produit 1 Chaussure Sport" data-price="49.99">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+1A" class="active">
      </div>
      <div class="product-title">Echarpe Solis</div>
      <div class="product-price">29,90 €</div>
    </div>

    <div class="product-card" data-title="Produit 2 Veste Hiver" data-price="59.99">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+2A" class="active">
      </div>
      <div class="product-title">Echarpe Veyra</div>
      <div class="product-price">25,99 €</div>
    </div>

    <div class="product-card" data-title="Produit 3 Casque Audio" data-price="79.99">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+3A" class="active">
      </div>
      <div class="product-title">Echarpe Eryos</div>
      <div class="product-price">39,90 €</div>
    </div>

    <div class="product-card" data-title="Produit 4 Sac à Dos" data-price="39.99">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+4A" class="active">
      </div>
      <div class="product-title">Echarpe Oslo</div>
      <div class="product-price">29,90 €</div>
    </div>

    <div class="product-card" data-title="Produit 5 Montre Connectée" data-price="99.99">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+5A" class="active">
      </div>
      <div class="product-title">Echarpe Liora</div>
      <div class="product-price">29,90 €</div>
    </div>

    <div class="product-card" data-title="Produit 6 Lunettes Soleil" data-price="29.99">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+6A" class="active">
      </div>
      <div class="product-title">Echarpe Orelia</div>
      <div class="product-price">29,99 €</div>
    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- MENU LATERAL -->
  <div class="side-menu" id="sideMenu">
    <div class="menu-content">
      <div class="side-menu-header" id="closeMenu">&times;</div>
      <ul>
        <li><a href="#"><i class="fas fa-box"></i> Tous nos produits</a></li>
        <li><a href="#"><i class="fas fa-book-open"></i> L'histoire de DIVN</a></li>
        <li><a href="#"><i class="fas fa-question-circle"></i> Besoin d'aide ?</a></li>
        <li><a href="#"><i class="fas fa-users"></i> The FAM</a></li>
        <li><a href="#"><i class="fas fa-ship"></i> L’équipage</a></li>
        <li><a href="#"><i class="fas fa-user-plus"></i> Créer un compte</a></li>
      </ul>
      <div class="social-links">
        <a href="https://www.tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
      </div>
    </div>
  </div>

  <script>
    // Menu burger open/close
    const menuBurger = document.querySelector('.menu-burger');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const closeMenu = document.getElementById('closeMenu');

    menuBurger.addEventListener('click', () => {
      sideMenu.classList.add('active');
      overlay.style.display = 'block';
    });

    closeMenu.addEventListener('click', () => {
      sideMenu.classList.remove('active');
      overlay.style.display = 'none';
    });

    overlay.addEventListener('click', () => {
      sideMenu.classList.remove('active');
      overlay.style.display = 'none';
    });
  </script>

</body>
</html>
