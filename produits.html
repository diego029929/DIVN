<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; padding:10px; background:#f5f5f5; }
    .search-bar { flex:1; display:flex; margin:0 10px; }
    .search-bar input { flex:1; padding:5px; }
    .search-bar button { padding:5px 10px; }
    .filter-bar { display:flex; justify-content:space-between; align-items:center; padding:10px; background:#fff; border-bottom:1px solid #ddd; }
    .btn-home { background:white; color:black; padding:8px 15px; border-radius:5px; text-decoration:none; font-weight:bold; border:1px solid #ccc; transition:0.3s; }
    .btn-home:hover { background:#f0f0f0; }
    .products { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:20px; padding:20px; }
    .product-card { border:1px solid #ddd; border-radius:10px; overflow:hidden; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    .product-slider { position:relative; overflow:hidden; }
    .product-slider img { width:100%; display:none; }
    .product-slider img.active { display:block; }
    .slider-dots { display:flex; justify-content:center; padding:5px; }
    .slider-dots span { width:8px; height:8px; border-radius:50%; background:#ccc; margin:0 3px; display:inline-block; }
    .slider-dots span.active { background:#333; }
    .product-title { font-weight:bold; padding:10px; }
    .product-price { padding:0 10px 10px; color:#e60023; }
    .side-menu { position:fixed; top:0; left:-300px; width:300px; height:100%; background:#fff; box-shadow:2px 0 5px rgba(0,0,0,0.2); transition:0.3s; z-index:1000; }
    .side-menu.active { left:0; }
    .side-menu-header { display:flex; justify-content:flex-end; padding:10px; }
    .side-menu-header span { font-size:24px; cursor:pointer; }
    .side-menu ul { list-style:none; padding:0; margin:0; }
    .side-menu ul li { border-bottom:1px solid #eee; }
    .side-menu ul li a { display:block; padding:10px; text-decoration:none; color:#333; }
    .social-links { display:flex; justify-content:center; gap:15px; padding:15px; }
    .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; z-index:500; }
    .overlay.active { display:block; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="menu-burger"><i class="fas fa-bars"></i></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher un produit...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <div class="profile-icon"><i class="fas fa-user"></i></div>
  </header>

  <!-- RETOUR + TRI -->
  <div class="filter-bar">
    <a href="index.html" class="btn-home">Retour à l’accueil</a>
    <div class="filter">
      <select id="sort">
        <option value="pertinence">Pertinence</option>
        <option value="asc">Prix croissant</option>
        <option value="desc">Prix décroissant</option>
      </select>
    </div>
  </div>

  <!-- PRODUITS -->
  <div class="products">
    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+1A" class="active">
        <img src="https://via.placeholder.com/300x300?text=Produit+1B">
        <img src="https://via.placeholder.com/300x300?text=Produit+1C">
        <img src="https://via.placeholder.com/300x300?text=Produit+1D">
        <div class="slider-dots"><span class="active"></span><span></span><span></span><span></span></div>
      </div>
      <div class="product-title">Echarpe Solis</div>
      <div class="product-price">29,90 €</div>
    </div>
    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+2A" class="active">
        <img src="https://via.placeholder.com/300x300?text=Produit+2B">
        <img src="https://via.placeholder.com/300x300?text=Produit+2C">
        <img src="https://via.placeholder.com/300x300?text=Produit+2D">
        <div class="slider-dots"><span class="active"></span><span></span><span></span><span></span></div>
      </div>
      <div class="product-title">Echarpe Veyra</div>
      <div class="product-price">25,99 €</div>
    </div>
    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+3A" class="active">
        <img src="https://via.placeholder.com/300x300?text=Produit+3B">
        <img src="https://via.placeholder.com/300x300?text=Produit+3C">
        <img src="https://via.placeholder.com/300x300?text=Produit+3D">
        <div class="slider-dots"><span class="active"></span><span></span><span></span><span></span></div>
      </div>
      <div class="product-title">Echarpe Eryos</div>
      <div class="product-price">39,90 €</div>
    </div>
    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+4A" class="active">
        <img src="https://via.placeholder.com/300x300?text=Produit+4B">
        <img src="https://via.placeholder.com/300x300?text=Produit+4C">
        <img src="https://via.placeholder.com/300x300?text=Produit+4D">
        <div class="slider-dots"><span class="active"></span><span></span><span></span><span></span></div>
      </div>
      <div class="product-title">Echarpe Oslo</div>
      <div class="product-price">29,90 €</div>
    </div>
    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+5A" class="active">
        <img src="https://via.placeholder.com/300x300?text=Produit+5B">
        <img src="https://via.placeholder.com/300x300?text=Produit+5C">
        <img src="https://via.placeholder.com/300x300?text=Produit+5D">
        <div class="slider-dots"><span class="active"></span><span></span><span></span><span></span></div>
      </div>
      <div class="product-title">Echarpe Liora</div>
      <div class="product-price">29,90 €</div>
    </div>
    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+6A" class="active">
        <img src="https://via.placeholder.com/300x300?text=Produit+6B">
        <img src="https://via.placeholder.com/300x300?text=Produit+6C">
        <img src="https://via.placeholder.com/300x300?text=Produit+6D">
        <div class="slider-dots"><span class="active"></span><span></span><span></span><span></span></div>
      </div>
      <div class="product-title">Echarpe Orelia</div>
      <div class="product-price">29,99 €</div>
    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- MENU LATERAL -->
  <div class="side-menu" id="sideMenu">
    <div class="menu-content">
      <div class="side-menu-header"><span id="closeMenu">&times;</span></div>
      <ul>
        <li><a href="#"><i class="fas fa-box"></i> Tous nos produits</a></li>
        <li><a href="#"><i class="fas fa-book-open"></i> L'histoire de DIVN</a></li>
        <li><a href="#"><i class="fas fa-question-circle"></i> Besoin d'aide ?</a></li>
        <li><a href="#"><i class="fas fa-users"></i> The FAM</a></li>
        <li><a href="#"><i class="fas fa-ship"></i> L’équipage</a></li>
        <li><a href="#"><i class="fas fa-user-plus"></i> Créer un compte</a></li>
      </ul>
      <div class="social-links">
        <a href="https://www.tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
      </div>
    </div>
  </div>

  <script>
    const menuBtn=document.querySelector(".menu-burger");
    const sideMenu=document.getElementById("sideMenu");
    const overlay=document.getElementById("overlay");
    const closeMenu=document.getElementById("closeMenu");
    menuBtn.addEventListener("click",()=>{sideMenu.classList.add("active");overlay.classList.add("active");});
    closeMenu.addEventListener("click",()=>{sideMenu.classList.remove("active");overlay.classList.remove("active");});
    overlay.addEventListener("click",()=>{sideMenu.classList.remove("active");overlay.classList.remove("active");});
  </script>

</body>
</html>
