<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop DIVN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="topbar">
    <button class="menu-toggle">&#9776;</button>
    <div class="search-box">
      <input type="text" placeholder="Rechercher un produit...">
      <button><i class="fas fa-search"></i></button>
    </div>
    <a href="login.html" class="user-icon">
      <div class="bonhomme"></div>
    </a>
  </header>

  <!-- Menu latéral -->
  <aside class="sidebar">
    <button class="close-btn">&times;</button>
    <ul>
      <li><a href="produits.html">Tous nos produits</a></li>
      <li><a href="histoire.html">L'histoire de DIVN</a></li>
      <li><a href="aide.html">Besoin d'aide ?</a></li>
      <li><a href="fam.html">The FAM</a></li>
      <li><a href="equipage.html">L'équipage</a></li>
      <li><a href="compte.html">Créer un compte</a></li>
    </ul>
  </aside>

  <!-- Section image -->
  <section class="hero">
    <img src="https://via.placeholder.com/1000x300" alt="Image de présentation">
  </section>

  <!-- Tri -->
  <div class="sort-box">
    <select id="sort">
      <option value="pertinence">Pertinence</option>
      <option value="croissant">Prix croissant</option>
      <option value="decroissant">Prix décroissant</option>
    </select>
  </div>

  <!-- Produits -->
  <main class="products">
    <div class="product" data-price="49.99">
      <img src="https://via.placeholder.com/300x200" alt="Produit 1">
      <h3>Écharpe Élégante</h3>
      <p class="price">49,99 €</p>
    </div>
    <div class="product" data-price="59.99">
      <img src="https://via.placeholder.com/300x200" alt="Produit 2">
      <h3>Écharpe Hiver</h3>
      <p class="price">59,99 €</p>
    </div>
    <div class="product" data-price="79.99">
      <img src="https://via.placeholder.com/300x200" alt="Produit 3">
      <h3>Écharpe Douce</h3>
      <p class="price">79,99 €</p>
    </div>
    <div class="product" data-price="39.99">
      <img src="https://via.placeholder.com/300x200" alt="Produit 4">
      <h3>Écharpe Moderne</h3>
      <p class="price">39,99 €</p>
    </div>
    <div class="product" data-price="29.99">
      <img src="https://via.placeholder.com/300x200" alt="Produit 5">
      <h3>Écharpe Tendance</h3>
      <p class="price">29,99 €</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
