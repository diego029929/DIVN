<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* === Styles rapides pour l’affichage direct === */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #222;
      color: #fff;
    }

    .menu-burger, .profile-icon {
      font-size: 1.5em;
      cursor: pointer;
    }

    .search-bar {
      flex: 1;
      margin: 0 15px;
      display: flex;
    }

    .search-bar input {
      flex: 1;
      padding: 5px;
    }

    .search-bar button {
      padding: 5px 10px;
      background: #444;
      border: none;
      color: white;
      cursor: pointer;
    }

    .filter {
      padding: 15px;
      background: #f4f4f4;
      text-align: right;
    }

    .filter select {
      padding: 5px;
    }

    .back-home {
      padding: 15px;
      background: #fafafa;
    }

    .back-btn {
      text-decoration: none;
      background: #222;
      color: #fff;
      padding: 8px 15px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: #444;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      text-align: center;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: scale(1.02);
    }

    .product-slider img {
      width: 100%;
      display: none;
    }

    .product-slider img.active {
      display: block;
    }

    .slider-dots {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 8px 0;
    }

    .slider-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      display: inline-block;
    }

    .slider-dots .active {
      background: #222;
    }

    .product-title {
      font-weight: bold;
      margin: 10px 0;
    }

    .product-price {
      color: #555;
      margin-bottom: 15px;
    }

    /* Menu latéral */
    .overlay {
      display: none;
    }

    .side-menu {
      display: none;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="menu-burger"><i class="fas fa-bars"></i></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher un produit...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <div class="profile-icon"><i class="fas fa-user"></i></div>
  </header>

  <!-- TRI -->
  <div class="filter">
    <select id="sort">
      <option value="pertinence">Pertinence</option>
      <option value="asc">Prix croissant</option>
      <option value="desc">Prix décroissant</option>
    </select>
  </div>

  <!-- RETOUR ACCUEIL -->
  <div class="back-home">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Retour à l'accueil
    </a>
  </div>

  <!-- PRODUITS -->
  <div class="products">
    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+1A" class="active">
      </div>
      <div class="product-title">Echarpe Solis</div>
      <div class="product-price">29,90 €</div>
    </div>

    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+2A" class="active">
      </div>
      <div class="product-title">Echarpe Veyra</div>
      <div class="product-price">25,99 €</div>
    </div>

    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+3A" class="active">
      </div>
      <div class="product-title">Echarpe Eryos</div>
      <div class="product-price">39,90 €</div>
    </div>

    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+4A" class="active">
      </div>
      <div class="product-title">Echarpe Oslo</div>
      <div class="product-price">29,90 €</div>
    </div>

    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+5A" class="active">
      </div>
      <div class="product-title">Echarpe Liora</div>
      <div class="product-price">29,90 €</div>
    </div>

    <div class="product-card">
      <div class="product-slider">
        <img src="https://via.placeholder.com/300x300?text=Produit+6A" class="active">
      </div>
      <div class="product-title">Echarpe Orelia</div>
      <div class="product-price">29,99 €</div>
    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- MENU LATERAL -->
  <div class="side-menu" id="sideMenu">
    <div class="menu-content">
      <div class="side-menu-header">
        <span id="closeMenu">&times;</span>
      </div>
      <ul>
        <li><a href="#"><i class="fas fa-box"></i> Tous nos produits</a></li>
        <li><a href="#"><i class="fas fa-book-open"></i> L'histoire de DIVN</a></li>
        <li><a href="#"><i class="fas fa-question-circle"></i> Besoin d'aide ?</a></li>
        <li><a href="#"><i class="fas fa-users"></i> The FAM</a></li>
        <li><a href="#"><i class="fas fa-ship"></i> L’équipage</a></li>
        <li><a href="#"><i class="fas fa-user-plus"></i> Créer un compte</a></li>
      </ul>

      <div class="social-links">
        <a href="https://www.tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
      </div>
    </div>
  </div>

</body>
</html>
