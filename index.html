<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique DIVN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bannière -->
  <header class="banner">
    <div class="logo">
      <div class="bonhomme"></div>
    </div>
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Rechercher...">
    </div>
    <nav class="sidebar">
      <button class="menu-btn">☰ Menu</button>
      <ul class="menu">
        <li><a href="produits.html">Tous nos produits</a></li>
        <li><a href="histoire.html">DIVN l'histoire</a></li>
        <li><a href="equipage.html">L'équipage</a></li>
        <li><a href="fam.html">The Fam</a></li>
        <li><a href="aide.html">Besoin d'aide ?</a></li>
      </ul>
    </nav>
  </header>

  <!-- Section image -->
  <section class="hero">
    <img src="https://via.placeholder.com/900x300" alt="Image d'accueil">
  </section>

  <!-- Tri -->
  <section class="sort-section">
    <label for="sort">Trier par :</label>
    <select id="sort">
      <option value="pertinence">Pertinence</option>
      <option value="croissant">Prix croissant</option>
      <option value="decroissant">Prix décroissant</option>
    </select>
  </section>

  <!-- Produits -->
  <section class="products">
    <div class="product" data-price="20">
      <img src="https://via.placeholder.com/200x200" alt="Écharpe 1">
      <h3>Écharpe Élégante</h3>
      <p class="price">20€</p>
      <a href="produit1.html">Voir le produit</a>
    </div>
    <div class="product" data-price="35">
      <img src="https://via.placeholder.com/200x200" alt="Écharpe 2">
      <h3>Écharpe Chic</h3>
      <p class="price">35€</p>
      <a href="produit2.html">Voir le produit</a>
    </div>
    <div class="product" data-price="15">
      <img src="https://via.placeholder.com/200x200" alt="Écharpe 3">
      <h3>Écharpe Douce</h3>
      <p class="price">15€</p>
      <a href="produit3.html">Voir le produit</a>
    </div>
    <div class="product" data-price="40">
      <img src="https://via.placeholder.com/200x200" alt="Écharpe 4">
      <h3>Écharpe Luxe</h3>
      <p class="price">40€</p>
      <a href="produit4.html">Voir le produit</a>
    </div>
    <div class="product" data-price="25">
      <img src="https://via.placeholder.com/200x200" alt="Écharpe 5">
      <h3>Écharpe Moderne</h3>
      <p class="price">25€</p>
      <a href="produit5.html">Voir le produit</a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
                              </html>
