<script>
// SLIDER
document.querySelectorAll('.product-slider').forEach(slider => {
const slides = slider.querySelectorAll('img');
const dots = slider.querySelectorAll('.slider-dots span');
dots.forEach((dot, idx) => {
dot.addEventListener('click', () => {
slides.forEach(s => s.classList.remove('active'));
dots.forEach(d => d.classList.remove('active'));
slides[idx].classList.add('active');
dots[idx].classList.add('active');
});
});
});

// MENU BURGER
const menuBtn = document.querySelector('.menu-burger');
const sideMenu = document.getElementById('sideMenu');
const closeBtn = document.getElementById('closeMenu');
const overlay = document.getElementById('overlay');
menuBtn.addEventListener('click', () => {
sideMenu.classList.add('active');
overlay.classList.add('show');
document.body.style.overflow = "hidden";
});
closeBtn.addEventListener('click', () => {
sideMenu.classList.remove('active');
overlay.classList.remove('show');
document.body.style.overflow = "";
});
overlay.addEventListener('click', () => {
sideMenu.classList.remove('active');
overlay.classList.remove('show');
document.body.style.overflow = "";
});

// BARRE DE RECHERCHE
const searchInput = document.querySelector('.search-bar input');
const searchBar = document.querySelector('.search-bar');
const searchBtn = document.getElementById('searchBtn');
const productContainer = document.querySelector('.products');
[searchInput, searchBtn].forEach(el => {
el.addEventListener('focus', () => searchBar.classList.add('active'));
el.addEventListener('blur', () => searchBar.classList.remove('active'));
});

// FILTRAGE + TRI
function normalize(str){return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function similarity(str,keyword){const words=normalize(str).split(" ");const keys=normalize(keyword).split(" ");return keys.reduce((score,key)=>score+(words.includes(key)?1:0),0);}
function filterProducts(){
const query=searchInput.value.trim();
const sort=document.getElementById('sort').value;
let cards=Array.from(document.querySelectorAll('.product-card'));
cards.forEach(card=>{card.dataset.score=similarity(card.dataset.title,query);});
if(query!==""){cards=cards.filter(card=>card.dataset.score>0);}
if(sort==="pertinence"){cards.sort((a,b)=>b.dataset.score-a.dataset.score);}
else if(sort==="asc"){cards.sort((a,b)=>parseFloat(a.dataset.price)-parseFloat(b.dataset.price));}
else if(sort==="desc"){cards.sort((a,b)=>parseFloat(b.dataset.price)-parseFloat(a.dataset.price));}
productContainer.innerHTML="";
cards.forEach(c=>productContainer.appendChild(c));
}
searchInput.addEventListener("input",filterProducts);
document.getElementById("sort").addEventListener("change",filterProducts);

// PRODUITS CLIQUE -> PAGE PRODUIT
const productPages=['produit1.html','produit2.html','produit3.html','produit4.html','produit5.html','produit6.html'];
document.querySelectorAll('.product-card').forEach((card,index)=>{card.addEventListener('click',()=>{window.location.href=productPages[index]||'index.html';});});

// CLIQUE SUR MENU
document.querySelectorAll('.side-menu ul li a').forEach(link=>{
link.addEventListener('click',e=>{
e.preventDefault();
const text=link.textContent.trim();
let page='index.html';
if(text.includes('Tous nos produits')) page='produits.html';
else if(text.includes("L'histoire")) page='histoire.html';
else if(text.includes("Besoin d'aide")) page='aide.html';
else if(text.includes('The FAM')) page='fam.html';
else if(text.includes('L’équipage')) page='equipage.html';
else if(text.includes('Créer un compte')) page='compte.html';
window.location.href=page;
});
});

// PROFIL
document.querySelector('.profile-icon').addEventListener('click',()=>{window.location.href='compte.html';});
</script>
